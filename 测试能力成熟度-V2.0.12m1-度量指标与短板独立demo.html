<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试能力成熟度 - 度量指标与能力短板 Demo</title>
<style>
:root{--ink:#1d2a38;--muted:#69798a;--line:#dce4ec;--panel:#fff;--bg:#f3f6f8;--blue:#1769aa;--green:#197452;--green-bg:#e5f4ec;--red:#ae3932;--red-bg:#fce9e7;--amber:#8c650e;--amber-bg:#fff2d5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}.shell{min-height:100vh;display:grid;grid-template-columns:218px 1fr}.side{background:#18334b;color:#d9e7f3;padding:18px 14px}.brand{font-weight:800;font-size:16px;padding:4px 8px 18px}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;background:#fff;color:#18334b;border-radius:5px}.version{margin:0 8px 22px;padding:7px 9px;border:1px solid #38566f;border-radius:5px;font-size:11px;color:#bcd0df}.nav{display:grid;gap:4px}.nav div{padding:9px 10px;border-radius:5px;font-size:12.5px}.nav .on{background:#2a5375;color:#fff;font-weight:700}.main{min-width:0;padding:20px 24px 36px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.formula{padding:7px 10px;border:1px solid #cfdae5;background:#fff;border-radius:5px;font-size:11.5px;color:#40566c;white-space:nowrap}.filters{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 14px;display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:10.5px;margin-bottom:4px}.field select{width:100%;border:1px solid #c7d3df;background:#fff;border-radius:5px;padding:7px 9px;color:var(--ink);font:inherit;font-size:12px}.scope{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11.5px;margin:0 2px 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}.stat span{display:block;color:var(--muted);font-size:10.5px}.stat b{display:block;font-size:22px;margin-top:4px}.workspace{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.workhead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}.workhead h2{font-size:16px;margin:0}.workhead p{font-size:11px;color:var(--muted);margin:4px 0 0}.tabs{display:flex;border:1px solid #c5d1dd;border-radius:5px;overflow:hidden}.tabs button{border:0;background:#fff;color:#43586d;padding:6px 13px;font:inherit;font-size:11.5px;cursor:pointer}.tabs button+button{border-left:1px solid #c5d1dd}.tabs button.on{background:var(--blue);color:#fff}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.dot.green{background:#35a576}.dot.red{background:#d85c52}.dot.amber{background:#d7a02b}.tablewrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;min-width:760px}th{position:sticky;top:0;background:#f4f7fa;color:#607284;text-align:left;font-size:10.5px;padding:9px 12px;border-bottom:1px solid var(--line);z-index:1}td{padding:10px 12px;border-bottom:1px solid #edf1f4;font-size:11.5px}tbody tr:hover{background:#f8fbfd}.num{text-align:right;font-variant-numeric:tabular-nums}.name b{display:block}.name span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.scorecell{display:grid;grid-template-columns:46px minmax(70px,1fr);align-items:center;gap:8px}.track{height:7px;background:#e6edf3;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}.badge{display:inline-block;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:700;white-space:nowrap}.badge.advantage{background:var(--green-bg);color:var(--green)}.badge.shortfall{background:var(--red-bg);color:var(--red)}.badge.mixed{background:var(--amber-bg);color:var(--amber)}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.foot{margin-top:10px;color:var(--muted);font-size:10.5px;text-align:right}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.filters{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.top{display:block}.formula{margin-top:10px;white-space:normal}.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.workhead{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tabs button{flex:1;padding:7px 4px}.scope{display:block}.scope span{display:block;margin-top:3px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span>TM</span>测试成熟度中心</div>
    <div class="version">独立 Demo · V2.0.12m1-html</div>
    <div class="nav"><div class="on">能力优势与短板</div><div>度量指标</div><div>组织关系</div><div>数据字典</div></div>
  </aside>
  <main class="main">
    <div class="top"><div><h1>当前科组 / 部门 / 业务能力优势与短板</h1><p>同一领域、同一评估维度，按组织关联关系聚合</p></div><div class="formula">2级达成率 × 2 + 3级达成率 + 4级达成率 · 目标 3.0 / 满分 4.0</div></div>
    <section class="filters">
      <div class="field"><label>领域</label><select id="domain"></select></div>
      <div class="field"><label>评估维度</label><select id="dimension"></select></div>
      <div class="field"><label>业务线</label><select id="business"></select></div>
      <div class="field"><label>三级部门</label><select id="department"></select></div>
      <div class="field"><label>科组</label><select id="team"></select></div>
    </section>
    <div class="scope"><span id="scopeText"></span><span id="sampleText"></span></div>
    <section class="stats"><div class="stat"><span id="stat1Label">组织数量</span><b id="stat1">-</b></div><div class="stat"><span>平均得分</span><b id="stat2">-</b></div><div class="stat"><span id="stat3Label">达到目标</span><b id="stat3">-</b></div><div class="stat"><span id="stat4Label">能力短板</span><b id="stat4">-</b></div></section>
    <section class="workspace">
      <div class="workhead"><div><h2 id="title">组织成熟度排名</h2><p id="subtitle"></p></div><div class="tabs" id="tabs"><button data-mode="team" class="on">按科组</button><button data-mode="department">按部门</button><button data-mode="business">按业务线</button></div></div>
      <div class="legend"><span><i class="dot green"></i>同时达到目标与同层级平均：能力优势</span><span><i class="dot red"></i>同时低于目标与同层级平均：能力短板</span><span><i class="dot amber"></i>仅满足其中一项：单项偏离</span></div>
      <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </section>
    <div class="foot">演示数据内嵌 · 单文件离线运行 · 不写入正式数据</div>
  </main>
</div>
<script>
const TARGET=3,MAX=4,WEIGHTS={'2级':2,'3级':1,'4级':1};
const teams=[
 {id:'t1',name:'软件基础测试组',domains:['软件']},{id:'t2',name:'PLC产品测试组',domains:['软件','硬件']},{id:'t3',name:'嵌入式测试组',domains:['软件','硬件']},
 {id:'t4',name:'硬件验证组',domains:['硬件','可靠性']},{id:'t5',name:'EMC测试组',domains:['EMC','可靠性']},{id:'t6',name:'安规测试组',domains:['安规','硬件']}
];
const departments=[{id:'d1',name:'控制测试部',teamIds:['t1','t2','t3']},{id:'d2',name:'专业测试部',teamIds:['t4','t5','t6']}];
const businesses=[{id:'b1',name:'工业自动化业务线',teamIds:['t1','t2','t4']},{id:'b2',name:'新能源业务线',teamIds:['t3','t5','t6']}];
const dimensions=['测试设计','测试用例','测试执行','自动化测试','测试方案'];
function hash(text){let n=17;for(const c of text)n=(n*31+c.charCodeAt(0))%9973;return n}
const demoProfiles={
 '软件基础测试组':[4,0,3,1,2],
 'PLC产品测试组':[4,4,4,4,4],
 '嵌入式测试组':[3,3,3,3,3],
 '硬件验证组':[2.5,2.5,2.5,2.5,2.5],
 'EMC测试组':[1,1,1,1,1],
 '安规测试组':[2,2,2,2,2]
};
function countFor(team,domain,dimension,level){const score=(demoProfiles[team]||[2,2,2,2,2])[dimensions.indexOf(dimension)],total=level==='2级'?4:2,achievedByScore={4:[4,2,2],3:[4,1,1],2.5:[3,1,1],2:[2,1,1],1.5:[2,1,0],1:[2,0,0],0:[0,0,0]},values=achievedByScore[score]||achievedByScore[2],index=level==='2级'?0:level==='3级'?1:2;return{total,achieved:values[index]}}
const metrics=teams.flatMap(team=>team.domains.flatMap(domain=>dimensions.map(dimension=>{const levels={};let score=0;Object.entries(WEIGHTS).forEach(([level,weight])=>{const c=countFor(team.name,domain,dimension,level);const contribution=c.achieved/c.total*weight;levels[level]={...c,weight,contribution};score+=contribution});return{scope:'team',entityId:team.id,entity:team.name,domain,dimension,score,levels,teamCount:1}})));
function aggregate(scope,entities){return entities.flatMap(entity=>{const names=entity.teamIds.map(id=>teams.find(t=>t.id===id)?.name).filter(Boolean);const pairs=[...new Set(metrics.filter(m=>names.includes(m.entity)).map(m=>m.domain+'|'+m.dimension))];return pairs.map(pair=>{const[domain,dimension]=pair.split('|'),samples=metrics.filter(m=>names.includes(m.entity)&&m.domain===domain&&m.dimension===dimension);return{scope,entityId:entity.id,entity:entity.name,domain,dimension,score:samples.reduce((s,x)=>s+x.score,0)/samples.length,teamCount:samples.length}})})}
const departmentMetrics=aggregate('department',departments),businessMetrics=aggregate('business',businesses);
const allMetrics={team:metrics,department:departmentMetrics,business:businessMetrics};
const entities={team:teams,department:departments,business:businesses},labels={team:'科组',department:'部门',business:'业务线'};
let mode='team';const filters={domain:'all',dimension:'all',business:'all',department:'all',team:'all'};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(id,values,all){const el=$(id),value=filters[id];el.innerHTML=`<option value="all">${all}</option>`+values.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function teamIdsFor(type,name){if(name==='all')return null;const source=type==='business'?businesses:departments,item=source.find(x=>x.name===name);return new Set(item?.teamIds||[])}
function buildFilters(){options('domain',[...new Set(metrics.map(x=>x.domain))],'全部领域');options('dimension',dimensions,'全部评估维度');options('business',businesses.map(x=>x.name),'全部业务线');options('department',departments.map(x=>x.name),'全部部门');const b=teamIdsFor('business',filters.business),d=teamIdsFor('department',filters.department),available=teams.filter(t=>(!b||b.has(t.id))&&(!d||d.has(t.id))).map(x=>x.name);if(filters.team!=='all'&&!available.includes(filters.team))filters.team='all';options('team',available,'全部科组')}
function selectedScope(){return filters.team!=='all'?'team':filters.department!=='all'?'department':filters.business!=='all'?'business':null}
function selectedName(scope){return scope==='team'?filters.team:scope==='department'?filters.department:filters.business}
function filteredRows(scope){return allMetrics[scope].filter(row=>(filters.domain==='all'||row.domain===filters.domain)&&(filters.dimension==='all'||row.dimension===filters.dimension))}
function peerAverage(rows,domain,dimension){const peers=rows.filter(x=>x.domain===domain&&x.dimension===dimension);return peers.length?peers.reduce((s,x)=>s+x.score,0)/peers.length:null}
function status(score,average){const t=score>=TARGET,a=score>=average;return t&&a?'advantage':!t&&!a?'shortfall':'mixed'}
function render(){const selected=selectedScope();if(selected)mode=selected;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));$('tabs').style.display=selected?'none':'flex';const rows=filteredRows(mode),scopeName=selectedName(mode);if(!selected)renderRanking(rows);else renderDetail(rows.filter(x=>x.entity===scopeName),rows,scopeName);$('scopeText').textContent='当前范围：'+[filters.domain==='all'?'全部领域':filters.domain,filters.dimension==='all'?'全部评估维度':filters.dimension,filters.business==='all'?'全部业务线':filters.business,filters.department==='all'?'全部部门':filters.department,filters.team==='all'?'全部科组':filters.team].join(' · ');$('sampleText').textContent=`${rows.length} 条领域×评估维度指标`}
function renderRanking(rows){const ranking=entities[mode].map(entity=>{const samples=rows.filter(x=>x.entity===entity.name);return{name:entity.name,score:samples.length?samples.reduce((s,x)=>s+x.score,0)/samples.length:null,count:samples.length}}).filter(x=>x.score!==null).sort((a,b)=>b.score-a.score),avg=ranking.length?ranking.reduce((s,x)=>s+x.score,0)/ranking.length:0,enriched=ranking.map(x=>({...x,status:status(x.score,avg)})),advantages=enriched.filter(x=>x.status==='advantage').length,shortfalls=enriched.filter(x=>x.status==='shortfall').length,text={advantage:'能力优势',shortfall:'能力短板',mixed:'单项偏离'};$('title').textContent=`${labels[mode]}能力成熟度排名`;$('subtitle').textContent='按领域×评估维度指标平均得分从高到低，同时对比目标与同层级平均';setStats(labels[mode]+'数量',ranking.length,avg.toFixed(2),'能力优势',advantages,'能力短板',shortfalls);$('thead').innerHTML='<tr><th>排名 / 组织</th><th class="num">指标数</th><th>成熟度得分</th><th class="num">距目标</th><th class="num">同层级平均</th><th>判断</th></tr>';$('tbody').innerHTML=enriched.length?enriched.map((x,i)=>`<tr><td class="name"><b>${i+1}. ${esc(x.name)}</b><span>${labels[mode]}总体</span></td><td class="num">${x.count}</td><td><div class="scorecell"><b>${x.score.toFixed(2)}</b><span class="track"><i style="width:${Math.min(100,x.score/MAX*100).toFixed(0)}%"></i></span></div></td><td class="num">${signed(x.score-TARGET)}</td><td class="num">${avg.toFixed(2)}（${signed(x.score-avg)}）</td><td><span class="badge ${x.status}">${text[x.status]}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">当前筛选没有可计算指标</td></tr>'}
function renderDetail(entityRows,peerRows,name){const detail=entityRows.map(row=>{const average=peerAverage(peerRows,row.domain,row.dimension);return{...row,average,status:status(row.score,average)}}).sort((a,b)=>a.status===b.status?b.score-a.score:a.status==='shortfall'?-1:b.status==='shortfall'?1:a.status==='mixed'?-1:1),avg=detail.length?detail.reduce((s,x)=>s+x.score,0)/detail.length:0,advantages=detail.filter(x=>x.status==='advantage').length,shortfalls=detail.filter(x=>x.status==='shortfall').length;$('title').textContent=`${labels[mode]} ${name} · 能力优势与短板`;$('subtitle').textContent=`与目标 3.0 及全部${labels[mode]}同领域同评估维度平均值比较`;setStats('指标数量',detail.length,avg.toFixed(2),'能力优势',advantages,'能力短板',shortfalls);$('thead').innerHTML='<tr><th>领域 / 评估维度</th><th>成熟度得分</th><th class="num">目标 3.0</th><th class="num">同层级平均</th><th class="num">平均差值</th><th>判断</th></tr>';const text={advantage:'能力优势',shortfall:'能力短板',mixed:'单项偏离'};$('tbody').innerHTML=detail.length?detail.map(x=>`<tr><td class="name"><b>${esc(x.domain)} · ${esc(x.dimension)}</b><span>${x.teamCount} 个关联科组参与计算</span></td><td><div class="scorecell"><b>${x.score.toFixed(2)}</b><span class="track"><i style="width:${Math.min(100,x.score/MAX*100).toFixed(0)}%"></i></span></div></td><td class="num">${signed(x.score-TARGET)}</td><td class="num">${x.average.toFixed(2)}</td><td class="num">${signed(x.score-x.average)}</td><td><span class="badge ${x.status}">${text[x.status]}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">当前组织没有可计算的领域评估维度</td></tr>'}
function setStats(l1,v1,v2,l3,v3,l4,v4){$('stat1Label').textContent=l1;$('stat1').textContent=v1;$('stat2').textContent=v2;$('stat3Label').textContent=l3;$('stat3').textContent=v3;$('stat4Label').textContent=l4;$('stat4').textContent=v4}
function signed(v){return(v>=0?'+':'')+v.toFixed(2)}
document.querySelectorAll('#tabs button').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;render()});
['domain','dimension','business','department','team'].forEach(id=>$(id).onchange=()=>{filters[id]=$(id).value;if(id==='business'){filters.department='all';filters.team='all'}if(id==='department')filters.team='all';buildFilters();render()});
buildFilters();render();
</script>
</body>
</html>
